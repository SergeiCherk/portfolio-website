name: Тесты

# Запускается при пуше в main и при открытии/обновлении Pull Request в main —
# если тесты красные, это будет видно прямо в интерфейсе GitHub.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Прогнать тесты
        env:
          # Для CI достаточно любого фиксированного ключа — это не прод
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_DEBUG: "True"
        run: python manage.py test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Прогнать тесты
        run: npm run test

      - name: Проверить сборку
        run: npm run build
